name: Deploy Flutter Web To GitHub Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "30 8 * * 1-5"
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_BACKEND_URL: ${{ secrets.PUBLIC_BACKEND_URL || 'https://longterm-stock-research-assistant.onrender.com' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Export static 00631L data
        run: python backend/scripts/export_static_00631l_data.py --update --strict --output-dir web/00631l-static-data

      - name: Build web
        shell: bash
        run: |
          if [ -n "${PUBLIC_BACKEND_URL}" ]; then
            echo "Building Pages with live_proxy plus static_public fallback."
            flutter build web \
              --base-href="/longterm_stock_research_assistant/" \
              --dart-define=USE_00631L_LIVE_PROXY=true \
              --dart-define=00631L_PROXY_BASE_URL="${PUBLIC_BACKEND_URL}" \
              --dart-define=00631L_PROXY_TIMEOUT_MS="${PUBLIC_PROXY_TIMEOUT_MS:-1200}" \
              --dart-define=USE_00631L_STATIC_DATA=true \
              --dart-define=00631L_STATIC_DATA_BASE_URL=00631l-static-data
          else
            echo "PUBLIC_BACKEND_URL secret is not set; building static_public Pages mode."
            flutter build web \
              --base-href="/longterm_stock_research_assistant/" \
              --dart-define=USE_00631L_STATIC_DATA=true \
              --dart-define=00631L_STATIC_DATA_BASE_URL=00631l-static-data
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
