name: Deploy Flutter Web To GitHub Pages

on:
  workflow_dispatch:
    inputs:
      full_etf_refresh:
        description: "Run broad all-catalog recent ETF refresh before export"
        required: false
        default: "false"
      refresh_etf_histories:
        description: "Run selected and missing ETF history refresh before export"
        required: false
        default: "false"
  schedule:
    - cron: "30 8 * * 1-5"
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_BACKEND_URL: ${{ secrets.PUBLIC_BACKEND_URL || 'https://longterm-stock-research-assistant.onrender.com' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        shell: bash
        run: |
          set -euo pipefail
          release_tag=""
          if [[ "${GITHUB_REF}" == refs/tags/00631l-lab-v* ]]; then
            release_tag="${GITHUB_REF_NAME}"
          else
            for attempt in {1..12}; do
              git fetch --tags --force --quiet
              release_tag="$(git tag --points-at HEAD --list "00631l-lab-v*" | sort -V | tail -n 1)"
              if [[ -n "${release_tag}" ]]; then
                break
              fi
              echo "Release tag for ${GITHUB_SHA} not visible yet (attempt ${attempt}/12)."
              sleep 10
            done
          fi
          if [[ -n "${release_tag}" ]]; then
            echo "00631L_BACKEND_RELEASE_TAG=${release_tag}" >> "${GITHUB_ENV}"
            echo "00631L_BACKEND_APP_VERSION=${release_tag#00631l-lab-v}" >> "${GITHUB_ENV}"
          else
            echo "No release tag visible; static export will use untagged metadata."
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Import ETF catalog for price-history selection
        timeout-minutes: 2
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p backend/data
          python backend/scripts/import_etf_catalog.py --output backend/data/etf_catalog.json || cp backend/seeds/twse_etf_catalog_seed.json backend/data/etf_catalog.json

      - name: Import selected ETF price history
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.refresh_etf_histories == 'true' || inputs.full_etf_refresh == 'true'))
        timeout-minutes: 8
        continue-on-error: true
        run: python backend/scripts/import_etf_price_history.py --codes 00631L,0050,0056,006208,00692,00713,00757,00850,00878,00881,00919,00922,00923,00929,00940 --start-date 2026-01-01 --output-dir backend/data/etf_price_history --summary-only --progress-every 5

      - name: Import broad ETF recent price history
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_etf_refresh == 'true')
        timeout-minutes: 15
        continue-on-error: true
        run: python backend/scripts/import_etf_price_history.py --from-catalog --catalog-path backend/data/etf_catalog.json --limit 0 --start-date 2026-06-01 --output-dir backend/data/etf_price_history --allow-partial --summary-only --progress-every 25

      - name: Restore public ETF attempt evidence
        timeout-minutes: 2
        continue-on-error: true
        run: python backend/scripts/restore_public_etf_attempts.py --output-dir backend/data/etf_price_history --summary-only

      - name: Import missing ETF price history batch
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.refresh_etf_histories == 'true' || inputs.full_etf_refresh == 'true'))
        timeout-minutes: 10
        continue-on-error: true
        run: python backend/scripts/import_etf_price_history.py --from-catalog --missing-only --skip-attempted --retry-source-errors --catalog-path backend/data/etf_catalog.json --limit 50 --start-date 2026-06-01 --output-dir backend/data/etf_price_history --allow-partial --summary-only --progress-every 10

      - name: Probe missing ETF gap reasons
        timeout-minutes: 18
        continue-on-error: true
        shell: bash
        run: |
          for batch in 1 2 3; do
            echo "Probe missing ETF gap reasons batch ${batch}/3"
            python backend/scripts/import_etf_price_history.py --from-catalog --missing-only --skip-attempted --retry-source-errors --catalog-path backend/data/etf_catalog.json --limit 20 --start-date 2026-06-01 --output-dir backend/data/etf_price_history --allow-partial --summary-only --progress-every 10 || echo "WARN: missing ETF probe batch ${batch} did not complete"
          done

      - name: Import TPEx ETF price history fallback
        timeout-minutes: 12
        continue-on-error: true
        run: python backend/scripts/import_tpex_etf_price_history.py --from-catalog --missing-only --official-empty-only --catalog-path backend/data/etf_catalog.json --limit 0 --start-date 2026-06-01 --output-dir backend/data/etf_price_history --allow-partial --summary-only --progress-every 25

      - name: Export static 00631L data
        run: python backend/scripts/export_static_00631l_data.py --update --strict --min-row-count 2800 --max-coverage-age-days 7 --min-etf-catalog-row-count 100 --multi-etf-codes all-catalog --seed-price-history-path backend/seeds/00631l_price_history_seed.jsonl --seed-etf-catalog-path backend/seeds/twse_etf_catalog_seed.json --output-dir web/00631l-static-data --summary-only

      - name: Guard public static data regression
        run: python backend/scripts/guard_static_public_regression_00631l.py --local-dir web/00631l-static-data

      - name: Build web
        shell: bash
        run: |
          if [ -n "${PUBLIC_BACKEND_URL}" ]; then
            echo "Building Pages with live_proxy plus static_public fallback."
            flutter build web \
              --base-href="/longterm_stock_research_assistant/" \
              --dart-define=USE_00631L_LIVE_PROXY=true \
              --dart-define=00631L_PROXY_BASE_URL="${PUBLIC_BACKEND_URL}" \
              --dart-define=00631L_PROXY_TIMEOUT_MS="${PUBLIC_PROXY_TIMEOUT_MS:-8000}" \
              --dart-define=USE_00631L_STATIC_DATA=true \
              --dart-define=00631L_STATIC_DATA_BASE_URL=00631l-static-data
          else
            echo "PUBLIC_BACKEND_URL secret is not set; building static_public Pages mode."
            flutter build web \
              --base-href="/longterm_stock_research_assistant/" \
              --dart-define=USE_00631L_STATIC_DATA=true \
              --dart-define=00631L_STATIC_DATA_BASE_URL=00631l-static-data
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
