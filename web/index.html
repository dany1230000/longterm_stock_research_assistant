<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ETF 研究室：00631L 正二研究室是第一個完整研究室，提供官方內容物、歷史資料、回測、折溢價與資料狀態 PWA。">
  <meta name="application-name" content="ETF 研究室 · 00631L 正二研究室">
  <meta name="theme-color" content="#0F766E">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ETF研究室">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ETF 研究室 · 00631L 正二研究室</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      min-height: 100%;
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #app-loading {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .loading-card {
      width: min(420px, 100%);
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 18px;
      background: rgba(15, 23, 42, 0.92);
      box-shadow: 0 24px 80px rgba(15, 23, 42, 0.45);
      padding: 22px;
    }

    .loading-kicker {
      color: #5eead4;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .loading-title {
      margin: 8px 0 8px;
      font-size: 28px;
      font-weight: 900;
      line-height: 1.12;
    }

    .loading-copy {
      margin: 0;
      color: #cbd5e1;
      font-size: 14px;
      line-height: 1.55;
    }

    .loading-bar {
      height: 3px;
      margin-top: 18px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.22);
    }

    .loading-bar::before {
      content: "";
      display: block;
      width: 42%;
      height: 100%;
      border-radius: inherit;
      background: #5eead4;
      animation: loading-slide 1.2s ease-in-out infinite;
    }

    @keyframes loading-slide {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(260%); }
    }
  </style>
</head>
<body>
  <div id="app-loading" aria-live="polite">
    <div class="loading-card">
      <div class="loading-kicker">ETF Research Room</div>
      <div class="loading-title">ETF 研究室 · 00631L</div>
      <p class="loading-copy">
        正在載入公開資料。歷史與回測可使用 static public data；盤中 NAV 與官方最新內容物需要 backend 連線。
      </p>
      <div class="loading-bar" aria-hidden="true"></div>
    </div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('app-loading');
      if (loading) {
        loading.remove();
      }
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
