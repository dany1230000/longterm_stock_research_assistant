<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ETF 研究室：00631L 正二研究室是第一個完整研究室，提供官方內容物、歷史資料、回測、折溢價與資料狀態 PWA。">
  <meta name="application-name" content="ETF 研究室 · 00631L 正二研究室">
  <meta name="theme-color" content="#0F766E">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ETF研究室">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ETF 研究室 · 00631L 正二研究室</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      min-height: 100%;
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #app-loading {
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 10px 12px 16px;
      box-sizing: border-box;
    }

    .loading-shell {
      width: min(520px, 100%);
    }

    .loading-top {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 46px;
    }

    .loading-symbol {
      border-radius: 999px;
      background: rgba(20, 184, 166, 0.16);
      border: 1px solid rgba(94, 234, 212, 0.38);
      color: #99f6e4;
      font-size: 14px;
      font-weight: 900;
      padding: 7px 12px;
    }

    .loading-brand {
      flex: 1;
      min-width: 0;
    }

    .loading-kicker {
      color: #94a3b8;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .loading-title {
      margin-top: 1px;
      color: #f8fafc;
      font-size: 18px;
      font-weight: 900;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .loading-card {
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.92);
      box-shadow: 0 14px 44px rgba(15, 23, 42, 0.32);
      padding: 14px;
    }

    .loading-quote-line {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      margin-bottom: 10px;
    }

    .loading-price {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .loading-status {
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 800;
      padding-bottom: 5px;
    }

    .loading-copy {
      margin: 0 0 12px;
      color: #cbd5e1;
      font-size: 13px;
      line-height: 1.45;
    }

    .loading-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .loading-metric {
      border-radius: 12px;
      background: rgba(30, 41, 59, 0.72);
      border: 1px solid rgba(148, 163, 184, 0.18);
      padding: 10px;
    }

    .loading-metric-label {
      color: #94a3b8;
      font-size: 11px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .loading-bar {
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.22);
    }

    .loading-bar.short {
      width: 64%;
      margin-top: 7px;
      height: 8px;
    }

    .loading-bar::before {
      content: "";
      display: block;
      width: 42%;
      height: 100%;
      border-radius: inherit;
      background: #5eead4;
      animation: loading-slide 1.2s ease-in-out infinite;
    }

    @keyframes loading-slide {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(260%); }
    }

    .loading-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      justify-content: space-around;
      gap: 4px;
      padding: 9px 8px calc(9px + env(safe-area-inset-bottom));
      border-top: 1px solid rgba(148, 163, 184, 0.24);
      background: rgba(15, 23, 42, 0.96);
      color: #94a3b8;
      font-size: 11px;
      font-weight: 800;
    }

    .loading-nav span:first-child {
      color: #67e8f9;
    }
  </style>
</head>
<body>
  <div id="app-loading" aria-live="polite">
    <div class="loading-shell">
      <div class="loading-top">
        <div class="loading-symbol">00631L</div>
        <div class="loading-brand">
          <div class="loading-kicker">ETF 研究室</div>
          <div class="loading-title">00631L 正二研究室</div>
        </div>
      </div>
      <div class="loading-card">
        <div class="loading-quote-line">
          <div class="loading-price">--.--</div>
          <div class="loading-status">資料載入中</div>
        </div>
        <p class="loading-copy">
          正在載入公開資料。歷史與回測可使用公開靜態資料；盤中 NAV 與官方最新內容物需要 backend 連線。
        </p>
        <div class="loading-grid" aria-hidden="true">
          <div class="loading-metric">
            <div class="loading-metric-label">盤中 NAV</div>
            <div class="loading-bar"></div>
            <div class="loading-bar short"></div>
          </div>
          <div class="loading-metric">
            <div class="loading-metric-label">官方內容物</div>
            <div class="loading-bar"></div>
            <div class="loading-bar short"></div>
          </div>
          <div class="loading-metric">
            <div class="loading-metric-label">歷史回測</div>
            <div class="loading-bar"></div>
            <div class="loading-bar short"></div>
          </div>
          <div class="loading-metric">
            <div class="loading-metric-label">AI 分析</div>
            <div class="loading-bar"></div>
            <div class="loading-bar short"></div>
          </div>
        </div>
      </div>
      <div class="loading-nav" aria-hidden="true">
        <span>總覽</span>
        <span>歷史回測</span>
        <span>持倉</span>
        <span>AI</span>
        <span>我的</span>
      </div>
    </div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('app-loading');
      if (loading) {
        loading.remove();
      }
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
